<!doctype html>
<!-- `lang="fr"` et `translate="no"` ne sont pas cosmétiques : la page se
     déclarait en anglais tout en étant écrite en français, ce qui déclenchait
     la traduction automatique de Chrome sur mobile. Traduire réécrit les
     nœuds de texte dans le dos de React, qui plante ensuite sur
     « removeChild : le nœud à supprimer n'est pas un enfant de ce nœud ». -->
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Libre+Franklin:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap" rel="stylesheet">
    
    <title>Devis Facile BTP</title>
  </head>
  <body class="bg-devis-paper text-devis-calcule font-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
